<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>말랑말랑 꼬인 위치 서바이벌</title>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0; overflow: hidden; background-color: #fdfbf7; 
            font-family: 'Jua', sans-serif; touch-action: none; 
        }
        #ui-container { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            pointer-events: none; display: flex; flex-direction: column; 
            justify-content: space-between; padding: 20px; box-sizing: border-box; 
        }
        .top-bar { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
        
        .info-panel { 
            background: rgba(255, 255, 255, 0.95); padding: 15px 20px; 
            border-radius: 20px; border: 4px solid #ffb8b8;
            box-shadow: 0 6px 0 #ffb8b8, 0 10px 15px rgba(0,0,0,0.15); 
            pointer-events: auto; max-width: 65%;
        }
        .title { margin: 0 0 8px 0; font-size: 1.6rem; color: #ff4757; text-shadow: 1px 1px 0px rgba(0,0,0,0.1); }
        .desc { margin: 0 0 10px 0; font-size: 1.1rem; color: #2f3542; line-height: 1.4; }
        
        #condition-box {
            display: inline-block; background: #dfe6e9; color: #2d3436;
            padding: 5px 12px; border-radius: 8px; font-size: 0.95rem;
            margin-bottom: 10px; border: 2px solid #b2bec3;
        }

        .badge {
            display: inline-block; background: #1dd1a1; color: white;
            padding: 5px 12px; border-radius: 12px; font-size: 1rem;
            animation: bounce 2s infinite; border: 2px solid #10ac84;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-5px); }
            60% { transform: translateY(-3px); }
        }

        .hearts { 
            font-size: 1.8rem; background: white; padding: 10px 20px; 
            border-radius: 30px; border: 4px solid #f1f2f6;
            box-shadow: 0 6px 0 #f1f2f6, 0 5px 10px rgba(0,0,0,0.1); white-space: nowrap;
        }
        
        .btn-group { display: flex; gap: 15px; align-self: center; margin-bottom: 20px; }
        
        .btn { 
            pointer-events: auto; color: white; border: none; padding: 18px 35px; 
            font-size: 1.4rem; border-radius: 35px; cursor: pointer; 
            transition: all 0.1s; font-family: 'Jua', sans-serif;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }
        .btn:active { transform: translateY(6px); box-shadow: none !important; }
        
        .btn-submit { background: #ff7f50; box-shadow: 0 8px 0 #e55039; }
        .btn-next { background: #5352ed; box-shadow: 0 8px 0 #3742fa; display: none; }
        .btn-restart { background: #2ed573; box-shadow: 0 8px 0 #2bed4e; display: none; }

        #toast { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            background: rgba(47, 53, 66, 0.95); color: white; padding: 20px 40px; 
            border-radius: 20px; border: 4px solid #a4b0be;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            font-size: 1.6rem; display: none; z-index: 100; text-align: center; 
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <div class="top-bar">
            <div class="info-panel">
                <h1 class="title" id="stage-title">✨ 1단계 : 직육면체</h1>
                <div id="condition-box" style="display:none;"></div>
                <p class="desc">기준 선분(빨간색)과 <b>만나거나 평행한 선</b>을 찾아 지우세요.<br>화면을 드래그하여 입체도형을 돌려보세요!</p>
                <div class="badge">✌️ 지울 선은 두 번 연속 터치 하세요!</div>
            </div>
            <div class="hearts" id="heart-display">❤️❤️❤️</div>
        </div>
        <div class="btn-group">
            <button class="btn btn-restart" id="btn-restart">🔄 처음부터 다시</button>
            <button class="btn btn-submit" id="btn-submit">✅ 다 찾았어요!</button>
            <button class="btn btn-next" id="btn-next">➡️ 다음 단계로!</button>
        </div>
    </div>
    
    <div id="toast"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // --- 1. 씬 및 조명 설정 (입체감 강화) ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xfdfbf7);
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(6, 6, 8);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 명확한 구별을 위한 조명 추가
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
        dirLight.position.set(10, 20, 15);
        scene.add(dirLight);

        // --- 2. 게임 상태 및 스테이지 데이터 ---
        let hearts = 3;
        let currentStageIndex = 0;
        let isGameOver = false;
        let selectableLines = [];
        let stageObjects = []; 

        const stages = [
            { name: "1단계 : 직육면체", type: "cuboid", color: 0x1e272e },
            { name: "2단계 : 삼각기둥", type: "triPrism", color: 0x006266 },
            { name: "3단계 : 사각뿔", type: "pyramid", color: 0x5f27cd, condition: "밑면은 직사각형입니다." },
            { name: "4단계 : 정사면체", type: "tetrahedron", color: 0x833471 },
            { name: "5단계 : 정육각기둥", type: "hexPrism", color: 0x009432, condition: "밑면은 정육각형입니다." },
            { name: "6단계 : 사각뿔대", type: "frustum", color: 0x0652DD, condition: "밑면과 윗면은 서로 평행한 직사각형입니다." },
            { name: "7단계 : 평면의 함정", type: "flat", color: 0x34495e, condition: "모든 선분이 하나의 평면(바닥) 위에 있습니다." }
        ];

        // --- 3. 선분 그리기 함수 (입체 원기둥 적용) ---
        function createThickCylinder(p1, p2, color, opacity, isTarget) {
            const distance = p1.distanceTo(p2);
            const radius = isTarget ? 0.08 : 0.055; // 타겟 선분은 더 굵게
            
            const cylinderGeo = new THREE.CylinderGeometry(radius, radius, distance, 16);
            
            let material;
            if (opacity < 1.0) {
                // 연장선(반투명)은 빛 영향 없이 단순 표시 (z-fighting 방지)
                material = new THREE.MeshBasicMaterial({ 
                    color: color, transparent: true, opacity: opacity, depthWrite: false 
                });
            } else if (isTarget) {
                // 타겟선은 눈에 확 띄게 밝은 빨강(BasicMaterial)
                material = new THREE.MeshBasicMaterial({ color: 0xff3f34 });
            } else {
                // 일반 선분은 조명을 받아 입체적으로 보이도록 PhongMaterial 사용
                material = new THREE.MeshPhongMaterial({ 
                    color: color, shininess: 80 
                });
            }

            const cylinder = new THREE.Mesh(cylinderGeo, material);
            const position = new THREE.Vector3().addVectors(p1, p2).divideScalar(2);
            cylinder.position.copy(position);
            cylinder.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3().subVectors(p2, p1).normalize());
            
            cylinder.userData = { defaultOpacity: opacity };
            return cylinder;
        }

        function createLine(p1, p2, isTarget, isSkew, stageColor) {
            const group = new THREE.Group();
            // 타겟이면 밝은 빨강, 아니면 스테이지 고유 색상
            const color = isTarget ? 0xff3f34 : stageColor; 

            // 중심 선분
            const segment = createThickCylinder(p1, p2, color, 1.0, isTarget);
            group.add(segment);

            // 연장선 (길게 뻗어나가는 부분)
            const dir = new THREE.Vector3().subVectors(p2, p1).normalize();
            const extLength = 12;
            const p1Ext = new THREE.Vector3().copy(p1).addScaledVector(dir, -extLength);
            const p2Ext = new THREE.Vector3().copy(p2).addScaledVector(dir, extLength);

            group.add(createThickCylinder(p1Ext, p1, color, 0.15, false));
            group.add(createThickCylinder(p2, p2Ext, color, 0.15, false));

            group.userData = { isTarget, isSkew, isErased: false };
            
            // 터치 영역을 넉넉하게 잡기 위한 투명 튜브 (hitbox)
            const tubeGeo = new THREE.TubeGeometry(new THREE.LineCurve3(p1, p2), 20, 0.5, 8, false);
            const hitbox = new THREE.Mesh(tubeGeo, new THREE.MeshBasicMaterial({ visible: false }));
            hitbox.userData = group.userData; 
            hitbox.parentGroup = group; 
            
            group.add(hitbox);
            scene.add(group);
            stageObjects.push(group);
            
            if (!isTarget) selectableLines.push(hitbox);
        }

        // --- 4. 스테이지 빌더 ---
        function clearStage() {
            stageObjects.forEach(obj => scene.remove(obj));
            stageObjects = [];
            selectableLines = [];
        }

        function buildStage(index) {
            clearStage();
            const stage = stages[index];
            document.getElementById('stage-title').innerText = `✨ ${stage.name}`;
            
            const condBox = document.getElementById('condition-box');
            if (stage.condition) {
                condBox.innerText = `💡 조건: ${stage.condition}`;
                condBox.style.display = 'inline-block';
            } else {
                condBox.style.display = 'none';
            }

            const c = stage.color;

            if (stage.type === "cuboid") {
                const v = [
                    new THREE.Vector3(-1.5, -1.5, -1.5), new THREE.Vector3(1.5, -1.5, -1.5),
                    new THREE.Vector3(1.5, 1.5, -1.5), new THREE.Vector3(-1.5, 1.5, -1.5),
                    new THREE.Vector3(-1.5, -1.5, 1.5), new THREE.Vector3(1.5, -1.5, 1.5),
                    new THREE.Vector3(1.5, 1.5, 1.5), new THREE.Vector3(-1.5, 1.5, 1.5)
                ];
                createLine(v[4], v[5], true, false, c); 
                createLine(v[0], v[4], false, false, c); createLine(v[1], v[5], false, false, c);
                createLine(v[5], v[6], false, false, c); createLine(v[4], v[7], false, false, c);
                createLine(v[0], v[1], false, false, c); createLine(v[3], v[2], false, false, c);
                createLine(v[7], v[6], false, false, c);
                createLine(v[0], v[3], false, true, c); createLine(v[1], v[2], false, true, c);
                createLine(v[3], v[7], false, true, c); createLine(v[2], v[6], false, true, c);
            } 
            else if (stage.type === "triPrism") {
                const v = [
                    new THREE.Vector3(-1.5, -1.5, 1.5), new THREE.Vector3(1.5, -1.5, 1.5), new THREE.Vector3(0, -1.5, -1.5),
                    new THREE.Vector3(-1.5, 1.5, 1.5), new THREE.Vector3(1.5, 1.5, 1.5), new THREE.Vector3(0, 1.5, -1.5)
                ];
                createLine(v[0], v[1], true, false, c); 
                createLine(v[0], v[2], false, false, c); createLine(v[1], v[2], false, false, c);
                createLine(v[0], v[3], false, false, c); createLine(v[1], v[4], false, false, c);
                createLine(v[3], v[4], false, false, c);
                createLine(v[2], v[5], false, true, c); createLine(v[3], v[5], false, true, c);
                createLine(v[4], v[5], false, true, c);
            }
            else if (stage.type === "pyramid") {
                const v = [
                    new THREE.Vector3(-1.5, -1, 1.5), new THREE.Vector3(1.5, -1, 1.5),
                    new THREE.Vector3(1.5, -1, -1.5), new THREE.Vector3(-1.5, -1, -1.5),
                    new THREE.Vector3(0, 2, 0)
                ];
                createLine(v[0], v[1], true, false, c); 
                createLine(v[1], v[2], false, false, c); createLine(v[0], v[3], false, false, c);
                createLine(v[0], v[4], false, false, c); createLine(v[1], v[4], false, false, c);
                createLine(v[2], v[3], false, false, c); // 평행 (직사각형 밑면)
                createLine(v[2], v[4], false, true, c); createLine(v[3], v[4], false, true, c); 
            }
            else if (stage.type === "tetrahedron") {
                const v = [
                    new THREE.Vector3(0, -1, 2), new THREE.Vector3(1.732, -1, -1), new THREE.Vector3(-1.732, -1, -1),
                    new THREE.Vector3(0, 2, 0)
                ];
                createLine(v[0], v[1], true, false, c); 
                createLine(v[1], v[2], false, false, c); createLine(v[0], v[2], false, false, c);
                createLine(v[0], v[3], false, false, c); createLine(v[1], v[3], false, false, c);
                createLine(v[2], v[3], false, true, c); // 단 하나의 꼬인 위치
            }
            else if (stage.type === "hexPrism") {
                const v = [];
                for(let i=0; i<6; i++) {
                    let a = i * Math.PI / 3;
                    v.push(new THREE.Vector3(1.7*Math.cos(a), -1.5, 1.7*Math.sin(a)));
                }
                for(let i=0; i<6; i++) {
                    let a = i * Math.PI / 3;
                    v.push(new THREE.Vector3(1.7*Math.cos(a), 1.5, 1.7*Math.sin(a)));
                }
                createLine(v[0], v[1], true, false, c); // 밑면 타겟
                // 밑면은 모두 평행이거나 한 평면에서 만남 (isSkew: false)
                createLine(v[1], v[2], false, false, c); createLine(v[2], v[3], false, false, c);
                createLine(v[3], v[4], false, false, c); createLine(v[4], v[5], false, false, c);
                createLine(v[5], v[0], false, false, c);
                // 윗면 (6-7, 9-10은 평행)
                createLine(v[6], v[7], false, false, c); createLine(v[9], v[10], false, false, c);
                createLine(v[7], v[8], false, true, c); createLine(v[8], v[9], false, true, c);
                createLine(v[10], v[11], false, true, c); createLine(v[11], v[6], false, true, c);
                // 기둥 (0, 1은 만남, 나머지는 꼬인위치)
                createLine(v[0], v[6], false, false, c); createLine(v[1], v[7], false, false, c);
                createLine(v[2], v[8], false, true, c); createLine(v[3], v[9], false, true, c);
                createLine(v[4], v[10], false, true, c); createLine(v[5], v[11], false, true, c);
            }
            else if (stage.type === "frustum") {
                const v = [
                    new THREE.Vector3(-1.5, -1.5, 1.5), new THREE.Vector3(1.5, -1.5, 1.5),
                    new THREE.Vector3(1.5, -1.5, -1.5), new THREE.Vector3(-1.5, -1.5, -1.5),
                    new THREE.Vector3(-0.8, 1.5, 0.8), new THREE.Vector3(0.8, 1.5, 0.8),
                    new THREE.Vector3(0.8, 1.5, -0.8), new THREE.Vector3(-0.8, 1.5, -0.8)
                ];
                createLine(v[0], v[1], true, false, c); 
                // 밑면
                createLine(v[1], v[2], false, false, c); createLine(v[0], v[3], false, false, c);
                createLine(v[2], v[3], false, false, c); // 평행
                // 윗면
                createLine(v[4], v[5], false, false, c); // 평행
                createLine(v[5], v[6], false, true, c); createLine(v[6], v[7], false, false, c); // 6-7 평행
                createLine(v[7], v[4], false, true, c);
                // 기둥
                createLine(v[0], v[4], false, false, c); createLine(v[1], v[5], false, false, c);
                createLine(v[2], v[6], false, true, c); createLine(v[3], v[7], false, true, c);
            }
            else if (stage.type === "flat") {
                // 평면도형: 모든 선분이 동일 평면에 있으므로 꼬인 위치가 발생할 수 없음 (모두 지워야 함)
                const v = [
                    new THREE.Vector3(-2, 1.5, 0), new THREE.Vector3(2, 1.5, 0),
                    new THREE.Vector3(2, -1.5, 0), new THREE.Vector3(-2, -1.5, 0)
                ];
                createLine(v[0], v[1], true, false, c);
                createLine(v[1], v[2], false, false, c); createLine(v[2], v[3], false, false, c);
                createLine(v[3], v[0], false, false, c);
                createLine(v[0], v[2], false, false, c); // 대각선 추가 (동일 평면이므로 만남)
            }
        }

        // --- 5. 더블 탭(터치) 로직 ---
        let lastTapObject = null;
        let lastTapTime = 0;
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function onTouchEnd(event) {
            if (isGameOver) return;
            let clientX = event.changedTouches ? event.changedTouches[0].clientX : event.clientX;
            let clientY = event.changedTouches ? event.changedTouches[0].clientY : event.clientY;

            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(selectableLines);

            if (intersects.length > 0) {
                const hitObject = intersects[0].object;
                const currentTime = Date.now();
                
                // 400ms 이내에 연속 두 번 터치시 발동
                if (lastTapObject === hitObject && (currentTime - lastTapTime) < 400) {
                    handleLineErase(hitObject);
                    lastTapObject = null; 
                } else {
                    lastTapObject = hitObject;
                    lastTapTime = currentTime;
                }
            }
        }

        function handleLineErase(hitObject) {
            const data = hitObject.userData;
            const parentGroup = hitObject.parentGroup;

            if (data.isErased) return;

            if (data.isSkew) {
                hearts--;
                updateHearts();
                showToast("앗! 꼬인 위치에 있는 선이에요! 😢");
                if (hearts <= 0) gameOver();
            } else {
                data.isErased = true;
                parentGroup.children.forEach(child => { 
                    if(child.geometry.type === "CylinderGeometry") {
                        // 완전히 사라지게 하거나 투명하게 처리
                        child.material.opacity = 0.03; 
                        child.material.transparent = true;
                        if(child.material.type === "MeshPhongMaterial") {
                            child.material.depthWrite = false;
                        }
                    }
                });
            }
        }

        window.addEventListener('click', onTouchEnd);
        window.addEventListener('touchend', onTouchEnd, { passive: false });

        // --- 6. 게임 UI 및 흐름 제어 ---
        function updateHearts() {
            let heartStr = "";
            for(let i=0; i<3; i++) heartStr += (i < hearts) ? "❤️" : "🖤";
            document.getElementById('heart-display').innerText = heartStr;
        }

        function showToast(msg, isPersistent = false) {
            const toast = document.getElementById('toast');
            toast.innerHTML = msg;
            toast.style.display = 'block';
            if (!isPersistent) {
                setTimeout(() => { toast.style.display = 'none'; }, 2000);
            }
        }

        function gameOver() {
            isGameOver = true;
            showToast("하트를 모두 잃었어요!<br>처음부터 다시 도전하세요.", true);
            document.getElementById('btn-submit').style.display = 'none';
            document.getElementById('btn-next').style.display = 'none';
            document.getElementById('btn-restart').style.display = 'block';
        }

        document.getElementById('btn-submit').addEventListener('click', () => {
            if(isGameOver) return;
            const missedLines = selectableLines.filter(line => !line.userData.isSkew && !line.userData.isErased);
            
            if (missedLines.length > 0) {
                hearts--;
                updateHearts();
                if (hearts <= 0) gameOver();
                else showToast(`아직 지워야 할 선이 <b>${missedLines.length}개</b> 남았어요! 👀`);
            } else {
                if (currentStageIndex === stages.length - 1) {
                    showToast("🎉 서바이벌 7단계 모두 클리어!!<br>공간 감각 마스터로 임명합니다!", true);
                    isGameOver = true;
                    document.getElementById('btn-submit').style.display = 'none';
                    document.getElementById('btn-restart').style.display = 'block';
                } else {
                    showToast("정답입니다! 다음 단계로 넘어갈까요?", true);
                    isGameOver = true;
                    document.getElementById('btn-submit').style.display = 'none';
                    document.getElementById('btn-next').style.display = 'block';
                }
            }
        });

        document.getElementById('btn-next').addEventListener('click', () => {
            currentStageIndex++;
            isGameOver = false;
            document.getElementById('toast').style.display = 'none';
            document.getElementById('btn-submit').style.display = 'block';
            document.getElementById('btn-next').style.display = 'none';
            buildStage(currentStageIndex);
        });

        document.getElementById('btn-restart').addEventListener('click', () => {
            hearts = 3;
            currentStageIndex = 0;
            isGameOver = false;
            updateHearts();
            document.getElementById('toast').style.display = 'none';
            document.getElementById('btn-submit').style.display = 'block';
            document.getElementById('btn-restart').style.display = 'none';
            buildStage(currentStageIndex);
        });

        // 시작
        buildStage(currentStageIndex);
        updateHearts();

        // --- 7. 렌더링 루프 ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
